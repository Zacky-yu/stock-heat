<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🔥 基金实时估值 · 小龙财经</title>
<style>
:root {
  --bg: #0a0e17; --surface: #111827; --surface-2: #1a2332; --border: rgba(255,255,255,0.06);
  --text: #e2e8f0; --text-2: #94a3b8; --text-3: #64748b;
  --up: #ef4444; --up-bg: rgba(239,68,68,0.12);
  --down: #22c55e; --down-bg: rgba(34,197,94,0.12);
  --gold: #f59e0b; --blue: #3b82f6;
  --radius: 12px; --transition: 0.25s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar .logo{width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
.topbar h1{font-size:18px;font-weight:700}.topbar .sub{font-size:12px;color:var(--text-3)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar .ts{font-size:11px;color:var(--text-3)}
.search-box{display:flex;gap:4px}
.search-box input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;font-size:12px;width:110px;outline:none;font-family:inherit}
.search-box input:focus{border-color:var(--blue)}
.search-box button,.rbtn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:var(--transition);font-family:inherit}
.search-box button:hover,.rbtn:hover{background:rgba(59,130,246,0.12);color:var(--blue);border-color:var(--blue)}
.rbtn:disabled{opacity:.5;cursor:default}
.container{max-width:1200px;margin:0 auto;padding:20px 24px}
.st{text-align:center;margin-bottom:20px;color:var(--text-3);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.fc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:var(--transition)}
.fc:hover{border-color:rgba(59,130,246,0.2)}
.fc-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.fc-hdr .fn{font-size:15px;font-weight:600}
.fc-hdr .fc2{font-size:11px;color:var(--text-3);margin-top:2px}
.fc-hdr .est{font-size:22px;font-weight:700}
.fc-hdr .est .nav-info{font-size:11px;font-weight:400;color:var(--text-3);display:block;margin-top:2px}
.fc-sub{font-size:11px;color:var(--text-3);margin-bottom:10px}
.ht{width:100%;border-collapse:collapse;font-size:11px}
.ht th{padding:6px 4px;text-align:right;color:var(--text-3);font-weight:500;border-bottom:1px solid var(--border)}
.ht th:first-child{text-align:left}
.ht th:nth-child(2){text-align:left}
.ht td{padding:5px 4px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.03);font-variant-numeric:tabular-nums}
.ht td:first-child{text-align:left;color:var(--text-2)}
.ht td:nth-child(2){text-align:left;color:var(--text-2)}
.up{color:var(--up)}.dn{color:var(--down)}.fl{color:var(--text-3)}
.bar{height:4px;background:var(--surface-2);border-radius:2px;margin-top:10px;overflow:hidden}
.bar-in{height:100%;border-radius:2px;transition:var(--transition)}
.st-bar{text-align:center;margin-top:24px;padding:16px 0;border-top:1px solid var(--border);color:var(--text-3);font-size:11px}
footer{text-align:center;color:var(--text-3);font-size:11px;padding:12px 0 24px;opacity:.6}
@media(max-width:640px){.container{padding:12px}.topbar{padding:0 12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

  </div>

var ALL_CODES = [];
Object.keys(FD).forEach(function(k){FD[k].holdings.forEach(function(h){ALL_CODES.push(h.code)})});

function rc(f){
  var est = f.est || 0;
  var cls = est > 0 ? 'up' : est < 0 ? 'dn' : 'fl';
  var arrow = est > 0 ? '▲' : est < 0 ? '▼' : '--';
  var sign = est > 0 ? '+' : '';
  var maxW = Math.max.apply(null, f.holdings.map(function(h){return Math.abs(h.weight)}), 0.1);
  var navText = f.nav ? '<span class="nav-info">最新净值: ' + f.nav + ' (' + f.date + ')</span>' : '';
  return '<div class="fc" data-code="'+f.code+'"><div class="fc-hdr"><div><div class="fn">'+f.name+'</div><div class="fc2">'+f.code+'</div></div><div class="est '+cls+'">'+arrow+' '+sign+est.toFixed(2)+'%'+navText+'</div></div><div class="fc-sub">持仓明细（'+f.holdings.length+'只）</div><table class="ht"><thead><tr><th>股票</th><th>名称</th><th>仓位</th><th>实时涨跌</th><th>贡献</th></tr></thead><tbody>'+
  f.holdings.map(function(h){
    var hcls = h.live > 0 ? 'up' : h.live < 0 ? 'dn' : 'fl';
    var ccls = h.contrib > 0 ? 'up' : h.contrib < 0 ? 'dn' : 'fl';
    var barPct = (Math.abs(h.weight) / maxW * 100).toFixed(0);
    return '<tr><td>'+h.raw+'</td><td>'+h.name+'</td><td>'+h.weight.toFixed(2)+'%<div class="bar"><div class="bar-in" style="width:'+barPct+'%;background:'+(h.live>=0?'var(--up)':'var(--down)')+'"></div></div></td><td class="'+hcls+'">'+(h.live>0?'+':'')+h.live.toFixed(2)+'%</td><td class="'+ccls+'">'+(h.contrib>0?'+':'')+h.contrib.toFixed(4)+'%</td></tr>';
  }).join('')+
  '</tbody></table></div>';
}

function ra(){
  var html = '';
  Object.keys(FD).forEach(function(k){html += rc(FD[k])});
  document.getElementById('fg').innerHTML = html;
}

function calcEst(f){
  var est = 0;
  f.holdings.forEach(function(h){
    est += (h.live || 0) * h.weight / 100;
  });
  f.est = est;
}

async function refresh(){
  var btn = document.getElementById('rbtn');
  btn.disabled = true; btn.textContent = '⏳';
  document.getElementById('st').textContent = '⏳ 正在获取实时股价...';
  try{
    // Fetch live stock prices for all holdings
    var r = await fetch('https://qt.gtimg.cn/q='+ALL_CODES.join(','));
    var buf = await r.arrayBuffer();
    var d = new TextDecoder('gbk').decode(buf);
    var nd = {};
    d.split('\n').filter(Boolean).forEach(function(l){
      var m = l.match(/v_[^=]+="([^"]+)"/);
      if(m){
        var a = m[1].split('~');
        if(a.length > 32) nd[a[2]] = parseFloat(a[32]) || 0;
      }
    });
    
    // Update holdings with live data
    Object.keys(FD).forEach(function(k){
      FD[k].holdings.forEach(function(h){
        var raw = h.code.replace(/^(sh|sz)/,'');
        h.live = nd[raw] !== undefined ? nd[raw] : h.dayChg;
      });
      calcEst(FD[k]);
    });
    
    ra();
    var now = new Date().toLocaleString('zh-CN');
    document.getElementById('ut').textContent = now;
    document.getElementById('st').textContent = '✅ ' + now + ' · 实时股价已更新';
  } catch(e) {
    document.getElementById('st').textContent = '⚠️ 刷新失败: ' + e.message;
  }
  btn.disabled = false; btn.textContent = '🔄';
}

// Init with scraped data (use dayChg as initial live)
Object.keys(FD).forEach(function(k){
  FD[k].holdings.forEach(function(h){h.live = h.dayChg});
  calcEst(FD[k]);
});
ra();
document.getElementById('ut').textContent = FD[Object.keys(FD)[0]].date || '';

// Auto-refresh
document.getElementById('rbtn').onclick = refresh;
document.getElementById('sbtn').onclick = function(){
  var v = document.getElementById('si').value.trim();
  if(v && v.match(/^\d{6}$/)){
    window.open('https://fund.dayfund.com.cn/fundpre/'+v+'.html', '_blank');
  } else {
    alert('请输入6位基金代码');
  }
};
document.getElementById('si').onkeydown = function(e){
  if(e.key==='Enter') document.getElementById('sbtn').click();
};

setTimeout(function(){var b=document.getElementById('rbtn');if(b&&!b.disabled)b.click()},1500);
setInterval(function(){var b=document.getElementById('rbtn');if(b&&!b.disabled)b.click()},120000);
</script>

</html>
