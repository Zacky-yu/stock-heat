<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>📊 基金实时估值 · 小龙财经</title>
<style>
:root {
  --bg: #0a0e17; --surface: #111827; --surface-2: #1a2332; --border: rgba(255,255,255,0.06);
  --text: #e2e8f0; --text-2: #94a3b8; --text-3: #64748b;
  --up: #ef4444; --up-bg: rgba(239,68,68,0.12);
  --down: #22c55e; --down-bg: rgba(34,197,94,0.12);
  --gold: #f59e0b; --blue: #3b82f6;
  --radius: 12px; --transition: 0.25s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Apple Color Emoji","Segoe UI Emoji",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ─── Top Bar ─── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar .logo{width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
.topbar h1{font-size:18px;font-weight:700}.topbar .sub{font-size:12px;color:var(--text-3)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar .ts{font-size:11px;color:var(--text-3);font-family:"SF Mono",Consolas,monospace}

/* ─── Search ─── */
.search-box{display:flex;gap:4px;position:relative}
.search-box input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;font-size:12px;width:120px;outline:none;font-family:inherit}
.search-box input:focus{border-color:var(--blue)}
.search-box button,.rbtn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:var(--transition);font-family:inherit}
.search-box button:hover,.rbtn:hover{background:rgba(59,130,246,0.12);color:var(--blue);border-color:var(--blue)}
.rbtn:disabled{opacity:.5;cursor:default}
.rbtn.loading{animation:spin 0.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Search Results Dropdown ─── */
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:200px;overflow-y:auto;display:none;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.search-results.show{display:block}
.search-results .sr-item{padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);transition:var(--transition)}
.search-results .sr-item:last-child{border-bottom:none}
.search-results .sr-item:hover{background:var(--surface-2);color:var(--blue)}
.search-results .sr-item .sr-code{color:var(--text-3);margin-left:6px;font-family:"SF Mono",Consolas,monospace}

/* ─── Summary Bar ─── */
.summary-bar{display:flex;gap:16px;align-items:center;padding:12px 0;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.summary-bar .sb-item{display:flex;align-items:center;gap:4px}
.summary-bar .sb-num{font-weight:600;font-size:13px}
.summary-bar .badge{padding:2px 8px;border-radius:4px;font-weight:600;font-size:11px}
.summary-bar .badge.up-b{background:var(--up-bg);color:var(--up)}
.summary-bar .badge.dn-b{background:var(--down-bg);color:var(--down)}

/* ─── Sort Tabs ─── */
.sort-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.sort-tabs .st-btn{background:transparent;border:1px solid var(--border);color:var(--text-3);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:var(--transition);font-family:inherit}
.sort-tabs .st-btn:hover{border-color:var(--blue);color:var(--blue)}
.sort-tabs .st-btn.active{background:rgba(59,130,246,0.12);border-color:var(--blue);color:var(--blue)}

/* ─── Container & Grid ─── */
.container{max-width:1200px;margin:0 auto;padding:12px 24px}
.st{text-align:center;margin-bottom:12px;color:var(--text-3);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}

/* ─── Fund Card ─── */
.fc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:var(--transition);cursor:pointer}
.fc:hover{border-color:rgba(59,130,246,0.2)}
.fc.hidden{display:none}
.fc.highlight{border-color:var(--blue);box-shadow:0 0 16px rgba(59,130,246,0.15)}

.fc-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.fc-hdr .fn{font-size:15px;font-weight:600}
.fc-hdr .fc2{font-size:11px;color:var(--text-3);margin-top:2px;font-family:"SF Mono",Consolas,monospace}
.fc-hdr .est-group{text-align:right}
.fc-hdr .est{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.fc-hdr .est .nav-info{font-size:10px;font-weight:400;color:var(--text-3);display:block;margin-top:1px}

.fc-sub{font-size:11px;color:var(--text-3);margin-bottom:8px}

/* ─── Holdings Table ─── */
.ht-wrap{overflow:hidden;max-height:50px;transition:max-height 0.3s ease}
.ht-wrap.expanded{max-height:2000px}
.ht{width:100%;border-collapse:collapse;font-size:11px}
.ht th{padding:5px 4px;text-align:right;color:var(--text-3);font-weight:500;border-bottom:1px solid var(--border)}
.ht th:first-child{text-align:left}
.ht td{padding:4px 4px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.03);font-variant-numeric:tabular-nums}
.ht td:first-child{text-align:left;color:var(--text-2);font-family:"SF Mono",Consolas,monospace}
.ht td:nth-child(2){text-align:left;color:var(--text-2)}
.up{color:var(--up)}.dn{color:var(--down)}.fl{color:var(--text-3)}
.bar{height:3px;background:var(--surface-2);border-radius:2px;margin-top:4px;overflow:hidden}
.bar-in{height:100%;border-radius:2px;transition:var(--transition)}
.expand-hint{font-size:10px;color:var(--text-3);text-align:center;padding:4px 0 0;cursor:pointer;transition:var(--transition);user-select:none}
.expand-hint:hover{color:var(--blue)}

/* ─── Status / Footer ─── */
.st-bar{text-align:center;margin-top:20px;padding:12px 0;border-top:1px solid var(--border);color:var(--text-3);font-size:11px}
.status-row{display:flex;justify-content:center;gap:20px;align-items:center;flex-wrap:wrap}
.status-row .s-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.status-row .s-dot.live{background:var(--up)}.status-row .s-dot.offline{background:var(--text-3)}.status-row .s-dot.loading-s{background:var(--gold);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
footer{text-align:center;color:var(--text-3);font-size:10px;padding:10px 0 20px;opacity:.5}

/* ─── Market Status Banner ─── */
.market-status{text-align:center;padding:6px 0;font-size:11px;background:var(--surface);border-bottom:1px solid var(--border)}
.market-status .ms-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.market-status .ms-dot.open{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,0.4)}
.market-status .ms-dot.closed{background:#64748b}

/* ─── Responsive ─── */
@media(max-width:640px){
  .container{padding:8px 12px}
  .topbar{padding:0 12px;height:auto;min-height:52px;flex-wrap:wrap;gap:4px}
  .topbar-right{width:100%;justify-content:flex-end}
  .search-box input{width:90px}
  .grid{grid-template-columns:1fr}
  .summary-bar{gap:10px;font-size:11px}
  .fc-hdr .est{font-size:20px}
}

/* ─── Scroll-to-top ─── */
.scroll-top{position:fixed;bottom:20px;right:20px;width:36px;height:36px;background:var(--surface);border:1px solid var(--border);border-radius:50%;color:var(--text-2);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:16px;z-index:99;transition:var(--transition)}
.scroll-top.show{display:flex}
.scroll-top:hover{background:var(--surface-2);color:var(--blue);border-color:var(--blue)}
</style>
</head>

/* ─── 判断市场状态 ─── */
function getMarketStatus(){
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();
  var dow = now.getDay();
  if(dow === 0 || dow === 6) return {open:false, text:"周末休市"};
  // A股交易时间: 9:30-11:30, 13:00-15:00
  var mins = h*60+m;
  if(mins >= 570 && mins < 690) return {open:true, text:"交易中（上午 9:30-11:30）"};
  if(mins >= 690 && mins < 780) return {open:false, text:"午间休市 11:30-13:00"};
  if(mins >= 780 && mins < 900) return {open:true, text:"交易中（下午 13:00-15:00）"};
  if(mins >= 900) return {open:false, text:"已收盘"};
  return {open:false, text:"未开市"};
}

/* ─── Render Card ─── */
function rc(f){
  var est = f.est || 0;
  var cls = est > 0 ? 'up' : est < 0 ? 'dn' : 'fl';
  var arrow = est > 0 ? '▲' : est < 0 ? '▼' : '—';
  var sign = est > 0 ? '+' : '';
  var maxW = Math.max.apply(null, f.holdings.map(function(h){return Math.abs(h.weight)}), 0.1);
  var sectorBadge = f.sector ? '<span style="font-size:10px;color:var(--text-3);background:var(--surface-2);padding:1px 6px;border-radius:3px;margin-left:6px">'+f.sector+'</span>' : '';
  var navText = f.nav ? '<span class="nav-info">净值: ' + f.nav + ' (' + f.date + ')</span>' : '';
  var estVal = arrow + ' ' + sign + est.toFixed(2) + '%';

  return '<div class="fc" data-code="'+f.code+'" data-name="'+f.name+'">'+
    '<div class="fc-hdr">'+
      '<div><div class="fn">'+f.name+sectorBadge+'</div><div class="fc2">'+f.code+'</div></div>'+
      '<div class="est-group"><div class="est '+cls+'">'+estVal+'</div>'+navText+'</div>'+
    '</div>'+
    '<div class="fc-sub">持仓明细（'+f.holdings.length+'只）<span class="expand-hint" style="display:inline;margin-left:8px">展开 ▼</span></div>'+
    '<div class="ht-wrap">'+
    '<table class="ht"><thead><tr><th>股票</th><th>名称</th><th>仓位</th><th>涨跌</th><th>贡献</th></tr></thead><tbody>'+
    f.holdings.map(function(h){
      var hcls = h.live > 0 ? 'up' : h.live < 0 ? 'dn' : 'fl';
      var ccls = h.contrib > 0 ? 'up' : h.contrib < 0 ? 'dn' : 'fl';
      var barPct = (Math.abs(h.weight) / maxW * 100).toFixed(0);
      return '<tr><td>'+h.raw+'</td><td>'+h.name+'</td><td>'+h.weight.toFixed(2)+'%<div class="bar"><div class="bar-in" style="width:'+barPct+'%;background:'+(h.live>=0?'var(--up)':'var(--down)')+'"></div></div></td><td class="'+hcls+'">'+(h.live>0?'+':'')+h.live.toFixed(2)+'%</td><td class="'+ccls+'">'+(h.contrib>0?'+':'')+h.contrib.toFixed(2)+'%</td></tr>';
    }).join('')+
    '</tbody></table></div></div>';
}

/* ─── Render All ─── */
function renderAll(filter){
  var html = '';
  var keys = Object.keys(FD);
  var sorted = sortKeys(keys);
  sorted.forEach(function(k){
    var f = FD[k];
    if(filter){
      var lf = filter.toLowerCase();
      if(f.code.indexOf(lf) === -1 && f.name.toLowerCase().indexOf(lf) === -1) return;
    }
    html += rc(f);
  });
  document.getElementById('fg').innerHTML = html;

  // Bind expand/collapse
  document.querySelectorAll('.fc').forEach(function(card){
    card.addEventListener('click', function(e){
      // Don't toggle if clicking on table
      if(e.target.closest('.ht') || e.target.closest('.expand-hint')) return;
      var wrap = card.querySelector('.ht-wrap');
      var hint = card.querySelector('.expand-hint');
      if(wrap){
        var expanded = wrap.classList.toggle('expanded');
        hint.textContent = expanded ? '收起 ▲' : '展开 ▼';
      }
    });
    // Hint click triggers toggle too
    var hint = card.querySelector('.expand-hint');
    if(hint){
      hint.addEventListener('click', function(e){
        e.stopPropagation();
        var wrap = card.querySelector('.ht-wrap');
        if(wrap){
          var expanded = wrap.classList.toggle('expanded');
          hint.textContent = expanded ? '收起 ▲' : '展开 ▼';
        }
      });
    }
  });

  updateSummary();
}

/* ─── Sort ─── */
var curSort = 'default';
function sortKeys(keys){
  var arr = keys.map(function(k){ return FD[k]; });
  switch(curSort){
    case 'gain':
      arr.sort(function(a,b){ return (b.est||0) - (a.est||0); });
      break;
    case 'loss':
      arr.sort(function(a,b){ return (a.est||0) - (b.est||0); });
      break;
    case 'name':
      arr.sort(function(a,b){ return a.name.localeCompare(b.name); });
      break;
    case 'code':
      arr.sort(function(a,b){ return a.code.localeCompare(b.code); });
      break;
    default:
      // Keep original order
      break;
  }
  return arr.map(function(f){ return f.code; });
}

/* ─── Update Summary ─── */
function updateSummary(){
  var keys = Object.keys(FD);
  var up = 0, dn = 0, flat = 0;
  var totalEst = 0;
  keys.forEach(function(k){
    var e = FD[k].est || 0;
    totalEst += e;
    if(e > 0) up++; else if(e < 0) dn++; else flat++;
  });
  var avg = (totalEst / keys.length).toFixed(2);
  var best = keys.reduce(function(a,b){ return ((FD[a].est||0) > (FD[b].est||0)) ? a : b; });
  var worst = keys.reduce(function(a,b){ return ((FD[a].est||0) < (FD[b].est||0)) ? a : b; });

  document.getElementById('sb').innerHTML =
    '<span class="sb-item">基金: <span class="sb-num">'+keys.length+'</span> 只</span>'+
    '<span class="sb-item"><span class="badge up-b">▲ '+up+'</span></span>'+
    '<span class="sb-item"><span class="badge dn-b">▼ '+dn+'</span></span>'+
    (flat ? '<span class="sb-item">平 '+flat+'</span>' : '')+
    '<span class="sb-item">平均: <span class="sb-num '+(avg>0?'up':avg<0?'dn':'fl')+'">'+(avg>0?'+':'')+avg+'%</span></span>'+
    '<span class="sb-item" style="color:var(--text-3)">最佳: <span class="up">'+(FD[best].est>0?'▲':'')+FD[best].name.substring(0,8)+' '+(FD[best].est||0).toFixed(2)+'%</span></span>'+
    '<span class="sb-item" style="color:var(--text-3)">最差: <span class="dn">'+(FD[worst].est<0?'▼':'')+FD[worst].name.substring(0,8)+' '+(FD[worst].est||0).toFixed(2)+'%</span></span>';

  document.getElementById('scount').textContent = '基金: '+keys.length+' 只';
}

/* ─── Calculate Estimated NAV ─── */
function calcEst(f){
  var est = 0;
  f.holdings.forEach(function(h){ est += (h.live || 0) * h.weight / 100; });
  f.est = est;
}

/* ─── Refresh Data ─── */
async function refresh(){
  var btn = document.getElementById('rbtn');
  btn.disabled = true; btn.classList.add('loading');
  document.getElementById('st').textContent = '📡 正在获取实时股价...';
  document.getElementById('sdot').className = 's-dot loading-s';
  document.getElementById('sstat').textContent = '正在获取数据...';

  var ms = getMarketStatus();
  document.getElementById('msDot').className = 'ms-dot '+(ms.open?'open':'closed');
  document.getElementById('msText').textContent = ms.text;

  try{
    var r = await fetch('https://qt.gtimg.cn/q='+ALL_CODES.join(','));
    var buf = await r.arrayBuffer();
    var d = new TextDecoder('gbk').decode(buf);
    var nd = {};
    d.split('\n').filter(Boolean).forEach(function(l){
      var m = l.match(/v_[^=]+="([^"]+)"/);
      if(m){
        var a = m[1].split('~');
        if(a.length > 32) nd[a[2]] = parseFloat(a[32]) || 0;
      }
    });

    // Update holdings with live data
    Object.keys(FD).forEach(function(k){
      FD[k].holdings.forEach(function(h){
        var raw = h.code.replace(/^(sh|sz)/,'');
        h.live = nd[raw] !== undefined ? nd[raw] : h.live || 0;
        h.contrib = (h.live || 0) * h.weight / 100;
      });
      calcEst(FD[k]);
    });

    var now = new Date().toLocaleString('zh-CN');
    document.getElementById('ut').textContent = now;
    document.getElementById('st').textContent = ms.open
      ? '🟢 ' + now + ' · 实时股价已更新'
      : '⚪ ' + now + ' · 已收盘，显示最后行情';
    document.getElementById('sdot').className = 's-dot live';
    document.getElementById('sstat').textContent = ms.open ? '实时更新中' : '已收盘';

    renderAll(currentFilter);

  } catch(e) {
    document.getElementById('st').textContent = '⚠️ 获取实时数据失败，显示离线数据';
    document.getElementById('sdot').className = 's-dot offline';
    document.getElementById('sstat').textContent = '离线模式';
    renderAll(currentFilter);
  }

  btn.disabled = false; btn.classList.remove('loading');

  // Next refresh countdown
  var next = new Date(Date.now() + 120000);
  document.getElementById('snext').textContent = '下次刷新: ' + next.toLocaleTimeString('zh-CN');
}

/* ─── Search ─── */
var currentFilter = '';
var searchTimeout = null;

document.getElementById('si').addEventListener('input', function(){
  var v = this.value.trim();
  var sr = document.getElementById('sr');
  clearTimeout(searchTimeout);

  if(!v || v.length < 1){
    sr.classList.remove('show');
    currentFilter = '';
    renderAll('');
    updateSortButtons();
    return;
  }

  // Show dropdown
  var lv = v.toLowerCase();
  var matches = [];
  Object.keys(FD).forEach(function(k){
    var f = FD[k];
    if(f.code.indexOf(lv) !== -1 || f.name.toLowerCase().indexOf(lv) !== -1){
      matches.push({code: f.code, name: f.name});
    }
  });

  if(matches.length > 0){
    sr.innerHTML = matches.map(function(m){
      return '<div class="sr-item" data-code="'+m.code+'">'+m.name+'<span class="sr-code">'+m.code+'</span></div>';
    }).join('');
    sr.classList.add('show');

    // Click handler
    sr.querySelectorAll('.sr-item').forEach(function(item){
      item.addEventListener('click', function(){
        var code = this.dataset.code;
        document.getElementById('si').value = code;
        sr.classList.remove('show');
        scrollToFund(code);
      });
    });
  } else {
    sr.classList.remove('show');
  }

  // Also filter the grid
  searchTimeout = setTimeout(function(){
    currentFilter = v;
    renderAll(v);
    updateSortButtons();
  }, 200);
});

document.getElementById('si').addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    this.value = '';
    this.blur();
    document.getElementById('sr').classList.remove('show');
    currentFilter = '';
    renderAll('');
    updateSortButtons();
  }
});

// Close search dropdown on outside click
document.addEventListener('click', function(e){
  if(!e.target.closest('.search-box')){
    document.getElementById('sr').classList.remove('show');
  }
});

function scrollToFund(code){
  var el = document.querySelector('.fc[data-code="'+code+'"]');
  if(el){
    el.classList.add('highlight');
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.querySelector('.ht-wrap').classList.add('expanded');
    el.querySelector('.expand-hint').textContent = '收起 ▲';
    setTimeout(function(){ el.classList.remove('highlight'); }, 3000);
  }
}

/* ─── Sort Buttons ─── */
document.getElementById('stabs').addEventListener('click', function(e){
  var btn = e.target.closest('.st-btn');
  if(!btn) return;
  document.querySelectorAll('.st-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  curSort = btn.dataset.sort;
  renderAll(currentFilter);
});

function updateSortButtons(){
  // Keep current sort active
}

/* ─── Scroll To Top ─── */
document.getElementById('stbtn').addEventListener('click', function(){
  window.scrollTo({top:0, behavior:'smooth'});
});
window.addEventListener('scroll', function(){
  document.getElementById('stbtn').classList.toggle('show', window.scrollY > 400);
});

/* ═══════════════════════════════════════════════
   Initialization
   ═══════════════════════════════════════════════ */

// Initialize live & contrib to 0 (will be updated on first refresh)
Object.keys(FD).forEach(function(k){
  FD[k].holdings.forEach(function(h){
    h.live = h.live || 0;
    h.contrib = 0;
  });
  // Use last known dayChg as initial estimate
  // Keep initial values at 0 — first refresh will populate
  // (Original data had dayChg, removed for cleanliness)
  FD[k].holdings.forEach(function(h){
    h.contrib = (h.live || 0) * h.weight / 100;
  });
  calcEst(FD[k]);
});

// Initial render
renderAll('');

// Set initial timestamp
document.getElementById('ut').textContent = FD[Object.keys(FD)[0]].date || '';

// Market status initial
var ms = getMarketStatus();
document.getElementById('msDot').className = 'ms-dot '+(ms.open?'open':'closed');
document.getElementById('msText').textContent = ms.text;
