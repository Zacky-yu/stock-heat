<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🔥 火 A股热点 · 小龙财经</title>
<style>
:root {
  --bg: #0a0e17;
  --surface: #111827;
  --surface-2: #1a2332;
  --border: rgba(255,255,255,0.06);
  --text: #e2e8f0;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --up: #ef4444;
  --up-bg: rgba(239,68,68,0.12);
  --down: #22c55e;
  --down-bg: rgba(34,197,94,0.12);
  --gold: #f59e0b;
  --gold-bg: rgba(245,158,11,0.12);
  --blue: #3b82f6;
  --blue-bg: rgba(59,130,246,0.12);
  --purple: #8b5cf6;
  --purple-bg: rgba(139,92,246,0.12);
  --radius: 12px;
  --transition: 0.25s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden
}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100
}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar h1{font-size:18px;font-weight:700}
.topbar .sub{font-size:12px;color:var(--text-3);font-weight:500}
.logo{
  width:34px;height:34px;
  background:linear-gradient(135deg,#ef4444,#f59e0b);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;font-weight:700
}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar .ts{font-size:11px;color:var(--text-3)}
.search-box{display:flex;gap:4px}
.search-box input{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:4px 10px;border-radius:6px;font-size:12px;width:110px;outline:none;font-family:inherit
}
.search-box input:focus{border-color:var(--blue)}
.search-box button,.refresh-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
  padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:var(--transition);font-family:inherit
}
.search-box button:hover,.refresh-btn:hover{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.refresh-btn:disabled{opacity:.5;cursor:default}
.container{max-width:1200px;margin:0 auto;padding:20px 24px}
.section{margin-bottom:24px}
.section-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px
}
.section-title{font-size:14px;font-weight:600;color:var(--gold)}
.section-sub{font-size:11px;color:var(--text-3)}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;cursor:pointer;transition:var(--transition)
}
.card:hover{background:var(--surface-2);transform:translateY(-1px)}
.card .nm{font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.card .pr{font-size:20px;font-weight:700}
.card .cg{font-size:12px;margin-top:4px;font-weight:600}
.up{color:var(--up)}.dn{color:var(--down)}.fl{color:var(--text-3)}

/* Search panel */
#sp{display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
#sp.sh{display:block}
#sp .cl{float:right;background:0;border:0;color:var(--text-3);cursor:pointer;font-size:18px;padding:0 4px}
#sp .st{font-size:16px;font-weight:600;color:var(--gold);margin-bottom:14px}
#sp .sd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
#sp .sd .it{background:var(--surface-2);border-radius:8px;padding:10px;text-align:center}
#sp .sd .it .lb{color:var(--text-3);font-size:11px;margin-bottom:2px}
#sp .sd .it .vl{font-size:16px;font-weight:700}
#cc{width:100%;height:220px;margin-top:10px;background:var(--surface-2);border-radius:8px}
#cc canvas{width:100%;height:100%;border-radius:8px}
#sp .ss{color:var(--text-3);font-size:11px;margin-top:8px;text-align:center}

/* Status bar */
.status-bar{
  text-align:center;margin-top:24px;padding:16px 0;border-top:1px solid var(--border)
}
.status-bar .st{color:var(--text-3);font-size:11px}
.status-bar .st .label{color:var(--text-2);font-weight:600}

footer{text-align:center;color:var(--text-3);font-size:11px;padding:12px 0 24px;opacity:.6}

@media(max-width:640px){
  .container{padding:12px}.topbar{padding:0 12px}
  .grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}
  #sp .sd{grid-template-columns:repeat(2,1fr)}
  .topbar h1{font-size:15px}.search-box input{width:80px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">火</div>
    <div><h1>A股热点</h1><div class="sub">小龙财经 · 实时行情</div></div>
  </div>
  <div class="topbar-right">
    <span class="ts" id="ut"></span>
    <div class="search-box">
      <input id="si" placeholder="输入代码">
      <button id="sbtn">🔍</button>
    </div>
    <button class="refresh-btn" id="rbtn">🔄</button>
  </div>
</div>

<div class="container">

<div id="sp">
  <button class="cl" id="spc">✕</button>
  <div class="st" id="spt"></div>
  <div class="sd" id="spd"></div>
  <div id="cc"><canvas id="cv"></canvas></div>
  <div class="ss" id="sps"></div>
</div>

<div class="section">
  <div class="section-header">
    <div><span class="section-title">📈 大盘指数</span></div>
    <span class="section-sub">点击查看分时走势</span>
  </div>
  <div class="grid-4" id="ig"></div>
</div>

<div class="section">
  <div class="section-header">
    <div><span class="section-title">🔬 行业 ETF</span></div>
    <span class="section-sub">点击查看分时走势</span>
  </div>
  <div class="grid-4" id="eg"></div>
</div>

<div class="section">
  <div class="section-header">
    <div><span class="section-title">🏢 核心个股</span></div>
    <span class="section-sub">点击查看分时走势</span>
  </div>
  <div class="grid-3" id="sg"></div>
</div>

<div class="status-bar">
  <div class="st" id="st"><span class="label">✅</span> 数据已加载 · 1秒后自动刷新</div>
</div>

<footer>数据来源：腾讯财经 · 仅作参考</footer>
</div>

<script>
var D={"t":"2026/7/28 11:26:11","i":[{"c":"sh000001","n":"上证指数","p":3826.72,"g":-0.82},{"c":"sz399001","n":"深证成指","p":13711.69,"g":-3.09},{"c":"sz399006","n":"创业板指","p":3416.84,"g":-4.84},{"c":"sh000688","n":"科创50","p":1746.26,"g":-3.41}],"e":[{"c":"sz159995","n":"芯片ETF","p":1.214,"g":-5.01},{"c":"sh512480","n":"半导体ETF","p":1.078,"g":-4.09},{"c":"sh515700","n":"新能源车ETF","p":2.12,"g":-1.62},{"c":"sz159997","n":"电子ETF","p":2.113,"g":-4.78},{"c":"sh512100","n":"1000ETF","p":2.873,"g":-1.95},{"c":"sh512660","n":"军工ETF","p":1.083,"g":-1.9},{"c":"sh512880","n":"证券ETF","p":1.088,"g":-1.45},{"c":"sh512010","n":"医药ETF","p":0.368,"g":0},{"c":"sh588000","n":"科创50ETF","p":1.841,"g":-3.66},{"c":"sz159841","n":"券商ETF","p":0.987,"g":-1.5}],"s":[{"c":"sh600519","n":"贵州茅台","p":1310.2,"g":1.61},{"c":"sh688981","n":"中芯国际","p":140.94,"g":-1.97},{"c":"sz300750","n":"宁德时代","p":395,"g":-1.25},{"c":"sh600036","n":"招商银行","p":39.4,"g":1.03},{"c":"sz002594","n":"比亚迪","p":93.72,"g":1.43},{"c":"sh601318","n":"中国平安","p":53.57,"g":0.3},{"c":"sh600900","n":"长江电力","p":28.86,"g":1.8},{"c":"sz300059","n":"东方财富","p":19.47,"g":-0.92},{"c":"sz002475","n":"立讯精密","p":61.11,"g":-2.83}]};
var CS=[];D.i.forEach(function(x){CS.push(x.c)});
D.e.forEach(function(x){CS.push(x.c)});
D.s.forEach(function(x){CS.push(x.c)});

function rc(x){
  var c=x.g>0?"up":x.g<0?"dn":"fl";
  var a=x.g>0?"▲":x.g<0?"▼":"--";
  var s=x.g>0?"+":"";
  return '<div class="card" dc="'+x.c+'"><div class="nm">'+x.n+'</div><div class="pr '+c+'">'+x.p.toFixed(x.p<10?3:2)+'</div><div class="cg '+c+'">'+a+' '+s+x.g.toFixed(2)+'%</div></div>';
}

function ra(){
  document.getElementById("ig").innerHTML=D.i.map(rc).join("");
  document.getElementById("eg").innerHTML=D.e.map(rc).join("");
  document.getElementById("sg").innerHTML=D.s.map(rc).join("");
  document.getElementById("ut").textContent=D.t;
}

// Fetch with auto retry prefix
function qc(inp){
  var sp=document.getElementById("sp");sp.className="sh";
  document.getElementById("spt").textContent="🔍 "+inp.toUpperCase()+"...";
  document.getElementById("spd").innerHTML="";
  document.getElementById("sps").textContent="⏳ ...";
  
  function tf(code,t){
    fetch("https://qt.gtimg.cn/q="+code).then(function(r){return r.arrayBuffer()}).then(function(buf){
      var d=new TextDecoder("gbk").decode(buf);
      var m=d.match(/v_[^=]+="([^"]+)"/);
      if(m){var a=m[1].split("~");if(a.length>=10){sh(code,a);return}}
      if(t===0&&code.indexOf("sh")!==0&&code.indexOf("sz")!==0){tf("sh"+code,1);return}
      if(t===1){tf("sz"+inp,2);return}
      document.getElementById("sps").textContent="⚠️ 未找到该代码";
    }).catch(function(e){
      if(t===0&&code.indexOf("sh")!==0&&code.indexOf("sz")!==0){tf("sh"+code,1);return}
      if(t===1){tf("sz"+inp,2);return}
      document.getElementById("sps").textContent="⚠️ "+e.message;
    });
  }
  
  function sh(code,aa){
    var na=aa[1],pp=parseFloat(aa[3])||0,gg=parseFloat(aa[32])||0;
    var hh=parseFloat(aa[33])||0,ll=parseFloat(aa[34])||0,oo=parseFloat(aa[5])||0;
    var vv=parseFloat(aa[6])||0,aa2=parseFloat(aa[37])||0;
    document.getElementById("spt").textContent=na+" ("+code.toUpperCase()+")";
    var cl=gg>0?"up":gg<0?"dn":"fl";
    var ar=gg>0?"▲":gg<0?"▼":"--";
    var sg=gg>0?"+":"";
    var vs=vv>10000?(vv/10000).toFixed(2)+"万":vv.toFixed(0);
    var as=aa2>1e8?(aa2/1e8).toFixed(2)+"亿":aa2>10000?(aa2/10000).toFixed(2)+"万":aa2.toFixed(0);
    document.getElementById("spd").innerHTML=
      '<div class="it"><div class="lb">最新</div><div class="vl '+cl+'">'+pp.toFixed(pp<10?3:2)+'</div></div>'+
      '<div class="it"><div class="lb">涨跌幅</div><div class="vl '+cl+'">'+ar+' '+sg+gg.toFixed(2)+'%</div></div>'+
      '<div class="it"><div class="lb">今开</div><div class="vl">'+oo.toFixed(pp<10?3:2)+'</div></div>'+
      '<div class="it"><div class="lb">最高</div><div class="vl up">'+hh.toFixed(pp<10?3:2)+'</div></div>'+
      '<div class="it"><div class="lb">最低</div><div class="vl dn">'+ll.toFixed(pp<10?3:2)+'</div></div>'+
      '<div class="it"><div class="lb">成交量</div><div class="vl">'+vs+'</div></div>'+
      '<div class="it"><div class="lb">成交额</div><div class="vl">'+as+'</div></div>';
    fetch("https://ifzq.gtimg.cn/appstock/app/minute/query?code="+code).then(function(r){return r.json()}).then(function(dt){
      try{
        var ck=Object.keys(dt.data)[0];
        var md=dt.data[ck].data.data;
        if(!md||!md.length){document.getElementById("sps").textContent="✅ 无分时数据";return}
        dw(md,gg);document.getElementById("sps").textContent="✅ 分时走势 · 今日";
      }catch(e){document.getElementById("sps").textContent="⚠️ "+e.message}
    }).catch(function(e){document.getElementById("sps").textContent="⚠️ "+e.message});
  }
  tf(inp,0);
}

// Draw chart
function dw(md,chg){
  var cv=document.getElementById("cv");
  cv.width=document.getElementById("cc").offsetWidth||800;
  cv.height=220;
  var ctx=cv.getContext("2d");
  var W=cv.width,H=220,pl=60,pr=20,pt=20,pb=25;
  var ps=[];
  for(var i=0;i<md.length;i++){
    var pv=parseFloat(md[i].split(" ")[1]);
    if(!isNaN(pv))ps.push(pv);
  }
  if(ps.length<2){document.getElementById("sps").textContent+=" · 数据点不足";return}
  var mn=Math.min.apply(null,ps),mx=Math.max.apply(null,ps),rg=mx-mn||1;
  var lc=chg>=0?"#ef4444":"#22c55e";
  var fc=chg>=0?"rgba(239,68,68,0.08)":"rgba(34,197,94,0.08)";
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,0.06)";ctx.lineWidth=1;
  for(var g=0;g<4;g++){
    var y=pt+(H-pt-pb)*(g/4);
    ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(W-pr,y);ctx.stroke();
    ctx.fillStyle=chg>=0?lc:"#22c55e";ctx.font="10px sans-serif";ctx.textAlign="right";
    ctx.fillText((mn+(mx-mn)*(1-g/4)).toFixed(2),pl-5,y+3);
  }
  ctx.strokeStyle="rgba(255,255,255,0.08)";ctx.setLineDash([3,3]);
  var mp=(mx+mn)/2;ctx.beginPath();ctx.moveTo(pl,pt+(H-pt-pb)*(1-(mp-mn)/rg));ctx.lineTo(W-pr,pt+(H-pt-pb)*(1-(mp-mn)/rg));ctx.stroke();
  ctx.setLineDash([]);
  var step=(W-pl-pr)/(ps.length-1);
  ctx.beginPath();ctx.moveTo(pl,pt+(H-pt-pb)*(1-(ps[0]-mn)/rg));
  for(var i=1;i<ps.length;i++)ctx.lineTo(pl+i*step,pt+(H-pt-pb)*(1-(ps[i]-mn)/rg));
  ctx.strokeStyle=lc;ctx.lineWidth=2;ctx.stroke();
  var lx=pl+(ps.length-1)*step;ctx.lineTo(lx,H-pb);ctx.lineTo(pl,H-pb);ctx.closePath();
  ctx.fillStyle=fc;ctx.fill();
  ctx.fillStyle="rgba(255,255,255,0.3)";ctx.font="10px sans-serif";ctx.textAlign="center";
  var tms=["09:30","10:30","11:30/13","14:00","15:00"];
  for(var i=0;i<tms.length;i++)ctx.fillText(tms[i],pl+i*(W-pl-pr)/(tms.length-1),H-5);
  ctx.fillStyle=lc;ctx.textAlign="left";ctx.fillText(ps[ps.length-1].toFixed(2),Math.min(lx+5,W-55),15);
}

// Refresh dashboard
async function rd(){
  var b=document.getElementById("rbtn");
  b.textContent="⏳";b.disabled=true;
  document.getElementById("st").innerHTML='<span class="label">⏳</span> 正在获取最新数据...';
  try{
    var r=await fetch("https://qt.gtimg.cn/q="+CS.join(","));
    var buf=await r.arrayBuffer();
    var d=new TextDecoder("gbk").decode(buf);
    var nd={};
    d.split("\n").filter(Boolean).forEach(function(l){
      var mm=l.match(/v_[^=]+="([^"]+)"/);
      if(!mm)return;
      var aa=mm[1].split("~");
      if(aa.length>32)nd[aa[2]]={p:parseFloat(aa[3])||0,g:parseFloat(aa[32])||0};
    });
    var ok=0;
    D.i=D.i.map(function(x){var r=x.c.replace(/^(sh|sz)/,"");return nd[r]?(ok++,{c:x.c,n:x.n,p:nd[r].p,g:nd[r].g}):x});
    D.e=D.e.map(function(x){var r=x.c.replace(/^(sh|sz)/,"");return nd[r]?(ok++,{c:x.c,n:x.n,p:nd[r].p,g:nd[r].g}):x});
    D.s=D.s.map(function(x){var r=x.c.replace(/^(sh|sz)/,"");return nd[r]?(ok++,{c:x.c,n:x.n,p:nd[r].p,g:nd[r].g}):x});
    if(ok>0){
      ra();
      document.getElementById("ut").textContent=new Date().toLocaleString("zh-CN");
      document.getElementById("st").innerHTML='<span class="label">✅</span> '+new Date().toLocaleString("zh-CN");
    }else{
      document.getElementById("st").innerHTML='<span class="label">⚠️</span> 未获取到新数据';
    }
  }catch(e){
    document.getElementById("st").innerHTML='<span class="label">⚠️</span> '+e.message;
  }
  b.textContent="🔄";b.disabled=false;
}

// Init
ra();
document.getElementById("sbtn").onclick=function(){var v=document.getElementById("si").value.trim();if(v)qc(v)};
document.getElementById("si").onkeydown=function(e){if(e.key==="Enter"){var v=this.value.trim();if(v)qc(v)}};
document.getElementById("rbtn").onclick=rd;
document.getElementById("spc").onclick=function(){document.getElementById("sp").className=""};
document.getElementById("ct").onclick=function(e){var card=e.target.closest(".card");if(card){var code=card.getAttribute("dc");if(code)qc(code)}};

// Auto-refresh: after 1s then every 60s
setTimeout(function(){var rb=document.getElementById("rbtn");if(rb&&!rb.disabled)rb.click()},1000);
setInterval(function(){var rb=document.getElementById("rbtn");if(rb&&!rb.disabled)rb.click()},60000);
</script>
</body>
</html>
