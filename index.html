<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火 A股热点跟踪 · 小龙财经</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#080C16;color:#EAF0FF;font-family:-apple-system,BlinkMacSystemFont,“PingFang SC”,“Microsoft YaHei”,sans-serif;min-height:100vh}.container{max-width:1200px;margin:0 auto;padding:16px}header{text-align:center;padding:24px 16px;margin-bottom:20px;background:linear-gradient(135deg,#0E1A2E,#141C2E 50%,#1A2440);border:1px solid #253050;border-radius:14px}header h1{font-size:1.4em;color:#E8D48B;margin-bottom:4px}.section-title{font-size:0.85em;color:#C9A84C;margin-bottom:12px;padding:8px 12px;background:rgba(201,168,76,0.06);border-radius:8px;border-left:3px solid #C9A84C}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#141C2E;border:1px solid #253050;border-radius:10px;padding:14px}.up{color:#F05A5A}.down{color:#2EC4B6}.flat{color:#7C8AAA}@media(max-width:640px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}.hidden{display:none}.loading{padding:40px;text-align:center}</style></head><body><div class="container"><header><h1>火 A股热点跟踪</h1><div style="color:#7C8AAA;font-size:0.85em">小龙财经</div><div style="margin-top:8px"><span id="updateTime">⏱ ...</span> <button onclick="location.reload()" style="background:rgba(91,141,239,0.12);color:#5B8DEF;border:1px solid rgba(91,141,239,0.2);padding:4px 12px;border-radius:999px;cursor:pointer">🔄 刷新</button></div></header><div id="loading" class="loading"><div>正在加载...</div></div><div id="content" class="hidden"><div class="section-title">📈 大盘指数</div><div class="grid-4" id="ig"></div><div style="margin-top:16px" class="section-title">🔬 行业ETF</div><div class="grid-4" id="eg"></div><div style="margin-top:16px" class="section-title">🏢 核心股</div><div class="grid-3" id="sg"></div></div><div style="text-align:center;color:#55607A;font-size:0.75em;padding:20px;border-top:1px solid #1E2840;margin-top:20px">腾讯财经 · 实时数据</div></div><script>
var I=[{c:"sh000001",n:"上证指数"},{c:"sz399001",n:"深证成指"},{c:"sz399006",n:"创业板指"},{c:"sh000688",n:"科创50"}];
var E=[{c:"sz159995",n:"半导体ETF"},{c:"sh512480",n:"芯片ETF"},{c:"sh515700",n:"新能源ETF"},{c:"sz159997",n:"电子ETF"},{c:"sh512100",n:"1000ETF"},{c:"sh512660",n:"军工ETF"},{c:"sh512880",n:"证券ETF"},{c:"sh512010",n:"医药ETF"},{c:"sh588000",n:"科创50ETF"},{c:"sz159841",n:"券商ETF"}];
var S=[{c:"sh600519",n:"贵州茅台"},{c:"sh688981",n:"中芯国际"},{c:"sz300750",n:"宁德时代"},{c:"sh600036",n:"招商银行"},{c:"sz002594",n:"比亚迪"},{c:"sh601318",n:"中国平安"},{c:"sh600900",n:"长江电力"},{c:"sz300059",n:"东方财富"},{c:"sz002475",n:"立讯精密"}];
function p(l){var m=l.match(/v_[^=]+"([^"]+)"/);if(!m)return null;var a=m[1].split("~");return{name:a[1],pr:+a[3]||0,ch:+a[32]||0};}function rp(id,data){var el=document.getElementById(id);el.innerHTML="";data.forEach(function(s){var v=p(s.c);if(!v)return;var c=v.ch>0?"up":v.ch<0?"down":"flat";el.innerHTML+='<div class="card" style="margin-bottom:8px"><div style="font-size:0.8em;color:#7C8AAA">'+v.name+'</div><div class="'+c+'" style="font-size:1.2em;font-weight:600">'+v.pr.toFixed(v.pr<10?3:2)+'</div><div class="'+c+'">'+(v.ch>0?'▲ ':'▼ ')+(v.ch>0?'+':'')+v.ch.toFixed(2)+'%</div></div>';});}async function load(){try{var r=await fetch('https://qt.gtimg.cn/q='+[].concat(I,E,S).map(function(x){return x.c;}).join(','));var d=new TextDecoder('gbk').decode(await r.arrayBuffer());d.split('\n').filter(Boolean).forEach(function(l){var x=p(l);if(x&&!x.name.match(/^\d+$/)){rp('ig',I);rp('eg',E);rp('sg',S);}});document.getElementById('updateTime').textContent='⏱ '+new Date().toLocaleString('zh-CN');document.getElementById('loading').className='hidden';document.getElementById('content').className='';}catch(e){document.getElementById('loading').innerHTML='<span style="color:#F05A5A">⚠️ '+e.message+'</span>';}}load();</script></body></html>
